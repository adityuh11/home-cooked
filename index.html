function f(n,d=1){n=Math.round((+n||0)*10**d)/10**d;return Number.isInteger(n)?''+n:n.toFixed(d).replace(/0+$/,'').replace(/\.$/,'')}
function cover(){return `<section class="cover" id="home"><div class="inner"><h1>Home Cooked.</h1><p>The recipes you actually make, kept in one quiet place. Adjust servings or ingredient grams and the nutrition follows along.</p><div class="stats"><div class="stat"><b>7</b><span>saved recipes</span></div><div class="stat"><b>Live</b><span>calories, protein, carbs, fat and fiber</span></div><div class="stat"><b>Yours</b><span>edit amounts to match what you actually cooked</span></div></div><a class="start" href="#${R[0].id}">Start cooking ↓</a></div></section>`}
function recipe(r,i){let k=0,ings=r.groups.map(g=>`<li class="group">${g[0]}</li>`+g[1].map(x=>`<li class="ing"><label class="amt"><input inputmode="decimal" data-i="${k++}" data-n="${x[0]}" data-b="${x[1]}" value="${f(x[1],2)}"><span>g</span></label><span>${x[2]}</span></li>`).join('')).join('');return `<section class="recipe" id="${r.id}" data-i="${i}" data-title="${r.title}" data-short="${r.short}" style="--tone:${r.tone}"><div class="inner"><div class="hero"><div><small>${String(i+1).padStart(2,'0')} · ${r.tag}</small><h2>${r.title}</h2><p>${r.desc}</p></div><div class="orb">${r.icon}</div></div><article class="card"><div class="controls"><div class="serving"><div><label>Make this many servings</label></div><div class="step"><button class="minus">−</button><input class="servings" inputmode="decimal" data-b="${r.base}" value="${r.base}"><button class="plus">+</button></div></div><div class="macros"><div class="macrogrid">${['Calories','Protein','Carbs','Fat','Fiber'].map((x,j)=>`<div class="macro" data-m="${j}"><b></b><span>${x} · batch</span><em></em></div>`).join('')}</div></div></div><div class="body"><section class="ingredients"><h3>Ingredients</h3><ul class="list">${ings}</ul><div class="note"><b>Live macros.</b> Change any amount and the nutrition updates with it.</div></section><section class="method"><h3>Method</h3><ol class="steps">${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol><textarea placeholder="What would I change next time?"></textarea></section></div></article></div></section>`}
app.innerHTML=cover()+R.map(recipe).join('');nav.innerHTML=`<a href="#home" class="active" style="--tone:#e8ded0"><i>⌂</i><span>Home</span></a>`+R.map((r,i)=>`<a href="#${r.id}" data-i="${i}" style="--tone:${r.tone}"><i>${r.icon}</i><span>${r.short}</span></a>`).join('');mnav.innerHTML=`<a href="#home" class="active">⌂ Home</a>`+R.map((r,i)=>`<a href="#${r.id}" data-i="${i}">${r.icon} ${r.short}</a>`).join('');
function key(s,x){return `hc-${s.id}-${x}`}function totals(s){let t=[0,0,0,0,0];s.querySelectorAll('.ing input').forEach(x=>{let g=Math.max(0,+x.value||0),v=N[x.dataset.n]||N.zero;for(let i=0;i<5;i++)t[i]+=v[i]*g/100});return t}function macros(s){let n=Math.max(.01,+s.querySelector('.servings').value||1),t=totals(s);s.querySelectorAll('.macro').forEach((m,i)=>{m.querySelector('b').textContent=f(t[i],1)+(i?'g':'');m.querySelector('em').textContent=f(t[i]/n,1)+(i?'g':' kcal')+' / serving'})}
[...document.querySelectorAll('.recipe')].forEach(s=>{let sv=s.querySelector('.servings'),saved=+localStorage.getItem(key(s,'servings'));if(saved>0)sv.value=f(saved,2);sv.dataset.cur=sv.value;s.querySelectorAll('.ing input').forEach(x=>{let z=localStorage.getItem(key(s,'i'+x.dataset.i));if(z!==null)x.value=f(+z,2);x.oninput=()=>{localStorage.setItem(key(s,'i'+x.dataset.i),x.value);macros(s)};x.onfocus=()=>x.select()});function scale(v){let old=Math.max(.01,+sv.dataset.cur||1),next=Math.max(.25,+v||old),q=next/old;s.querySelectorAll('.ing input').forEach(x=>{x.value=f((+x.value||0)*q,2);localStorage.setItem(key(s,'i'+x.dataset.i),x.value)});sv.value=f(next,2);sv.dataset.cur=sv.value;localStorage.setItem(key(s,'servings'),sv.value);macros(s)}s.querySelector('.minus').onclick=()=>scale((+sv.value||1)-.25);s.querySelector('.plus').onclick=()=>scale((+sv.value||1)+.25);sv.onchange=()=>scale(sv.value);let ta=s.querySelector('textarea');ta.value=localStorage.getItem(key(s,'note'))||'';ta.oninput=()=>localStorage.setItem(key(s,'note'),ta.value);macros(s)});
function setActive(i){active=i;title.textContent=i<0?'Home Cooked':R[i].title;copy.hidden=i<0;document.querySelectorAll('.nav a,.mnav a').forEach(a=>a.classList.remove('active'));if(i<0){document.querySelector('.nav a').classList.add('active');document.querySelector('.mnav a').classList.add('active')}else{document.querySelector(`.nav a[data-i="${i}"]`).classList.add('active');let m=document.querySelector(`.mnav a[data-i="${i}"]`);m.classList.add('active');m.scrollIntoView({inline:'center',block:'nearest'});copy.textContent='Copy '+R[i].short}}
function detect(){let y=innerHeight*.38,h=document.getElementById('home').getBoundingClientRect();if(h.top<=y&&h.bottom>y)return setActive(-1);let best=0,d=1e9;document.querySelectorAll('.recipe').forEach((s,i)=>{let r=s.getBoundingClientRect(),q=r.top<=y&&r.bottom>y?0:Math.abs(r.top-y);if(q<d){d=q;best=i}});setActive(best)}addEventListener('scroll',detect,{passive:true});addEventListener('resize',detect);requestAnimationFrame(detect);
copy.onclick=async()=>{let s=document.querySelector(`.recipe[data-i="${active}"]`),serv=s.querySelector('.servings').value,ing=[...s.querySelectorAll('.ing')].map(x=>`• ${f(+x.querySelector('input').value,2)} g ${x.lastElementChild.textContent}`).join('\n'),steps=R[active].steps.map((x,i)=>`${i+1}. ${x}`).join('\n'),t=totals(s),names=['Calories','Protein','Carbs','Fat','Fiber'],ms=names.map((n,i)=>`${n}: ${f(t[i],1)}${i?' g':' kcal'} batch · ${f(t[i]/serv,1)}${i?' g':' kcal'} / serving`).join('\n'),txt=`${R[active].title}\nServings: ${serv}\n\nINGREDIENTS\n${ing}\n\nMETHOD\n${steps}\n\nMACROS\n${ms}`;try{await navigator.clipboard.writeText(txt);toast.textContent=R[active].short+' copied';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200)}catch(e){alert(txt)}};
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
